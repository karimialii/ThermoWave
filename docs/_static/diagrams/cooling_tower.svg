<style>
  .lbl { font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif; font-size:13px; fill:#2b3a4a; }
  .tag { font-family:Menlo,Consolas,monospace; font-size:12px; fill:#2b3a4a; }
  .title { font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif; font-size:15px; font-weight:600; fill:#2b3a4a; }
</style>
<text x="260.0" y="22" text-anchor="middle" class="title">CoolingTower (evaporative: heat AND mass transfer)</text>
