name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (dev extra)
        run: pip install -e ".[dev]"

      - name: ruff check
        run: ruff check src/ tests/

      - name: mypy
        # Pre-existing type debt (optional-extra fluid backends, a few
        # Optional-dict call sites) isn't clean yet; keep this visible but
        # non-blocking until that's paid down, rather than gating merges on
        # errors this workflow didn't introduce.
        run: mypy src/thermowave
        continue-on-error: true

      - name: pytest
        run: pytest
